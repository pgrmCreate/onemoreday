<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Banc d'essai — Combat</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: #e6dfcc; font-family: Oswald, system-ui, sans-serif; overflow: hidden; }
  #banc { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 16px; box-sizing: border-box; text-align: center; }
  #banc pre { max-width: min(720px, 92vw); max-height: 50vh; overflow: auto; text-align: left; font-size: 12px; background: #111; border: 1px solid #333; padding: 10px; white-space: pre-wrap; }
  #banc button { min-height: 56px; padding: 0 24px; background: #1a1a1a; color: #e6dfcc; border: 1px solid #c9a227; font: inherit; font-size: 18px; cursor: pointer; }
  #banc small { opacity: .7; max-width: 640px; }
</style>
</head>
<body>
<div id="banc">
  <div>Banc d'essai — combat</div>
  <small>Paramètres : ?zombies=errant,coureur · arme=couteau_cuisine · acces=pistolet_9mm,bandage · munitions=12 · tuto=1 · surprise=engage|normal|surpris · lieu=… · decor=rue|interieur|gare|campagne|eglise|usine · noir=1 · pv=100 · sta=100 · torse=… · pieds=… · seed=…</small>
  <pre id="res" hidden></pre>
  <button id="go" type="button">Lancer le combat</button>
</div>
<script type="module">
  import { nouvellePartie, G } from '../js/core/state.js';
  import * as vue from '../js/combat/vue.js';
  import { ITEMS } from '../js/game/donnees.js';

  const q = new URLSearchParams(location.search);
  function preparer() {
    nouvellePartie({ nom: q.get('nom') || 'Sam', genre: q.get('genre') || 'm', mode: 'solo', seed: +(q.get('seed') || 1234) });
    const p = G.player;
    p.equipEtat = p.equipEtat || {};
    const arme = q.get('arme');
    if (arme && ITEMS[arme]) {
      p.equip.arme = arme;
      p.equipEtat.arme = { dur: ITEMS[arme].dur ?? null, durMax: ITEMS[arme].dur ?? null };
      if (ITEMS[arme].tir) { p.equipEtat.arme.balles = ITEMS[arme].tir.capacite; p.inventaire.push({ id: ITEMS[arme].tir.munition, qty: +(q.get('munitions') || 12) }); }
    }
    for (const slot of ['tete', 'torse', 'mains', 'jambes', 'pieds', 'ceinture']) if (q.get(slot)) p.equip[slot] = q.get(slot);
    const acces = (q.get('acces') || '').split(',').filter(id => ITEMS[id]);
    if (acces.length && !p.equip.ceinture) p.equip.ceinture = 'ceinture_cuir';
    for (const id of acces) {
      const d = ITEMS[id];
      const inst = { id, qty: d.type === 'arme' ? 1 : 2 };
      if (d.dur) { inst.dur = d.dur; inst.durMax = d.dur; }
      if (d.tir) { inst.balles = d.tir.capacite; p.inventaire.push({ id: d.tir.munition, qty: +(q.get('munitions') || 12) }); }
      p.inventaire.push(inst);
      p.accesRapide.push(id);
    }
    if (q.get('pv')) p.pv = +q.get('pv');
    if (q.get('sta')) p.sta = +q.get('sta');
  }
  async function lancer() {
    preparer();
    const spec = {
      id: 'banc' + Date.now().toString(36),
      zombies: (q.get('zombies') || 'errant').split(',').filter(Boolean),
      lieuId: q.get('lieu') || undefined, decor: q.get('decor') || undefined,
      surprise: q.get('surprise') || 'normal', tuto: q.get('tuto') === '1', noir: q.get('noir') === '1',
    };
    document.getElementById('banc').style.visibility = 'hidden';
    const r = await vue.ouvrir({ spec });
    window.__resultat = r;
    const pre = document.getElementById('res');
    pre.hidden = false;
    pre.textContent = JSON.stringify({ resultat: r, joueur: { pv: G.player.pv, sta: G.player.sta, mal: G.player.mal, arme: G.player.equip.arme, equipEtat: G.player.equipEtat, blessures: G.player.blessures.map(b => `${b.type} ${b.zone}`), accesRapide: G.player.accesRapide } }, null, 1);
    document.getElementById('go').textContent = 'Rejouer';
    document.getElementById('banc').style.visibility = '';
  }
  window.__omd = { get G() { return G; }, vue, lancer };
  document.getElementById('go').addEventListener('click', lancer);
  if (q.get('auto') !== '0') lancer();
</script>
</body>
</html>
