<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Banc d'essai — Carte</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../css/carte.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #toasts { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 55; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #toasts div { background: rgba(0,0,0,.85); border-left: 3px solid #c9a227; padding: 6px 10px; font: 14px Georgia, serif; color: #e6dfcc; }
</style>
<!-- Simulations : scènes (dialogue.js absent), exploration et embuscades (?explore=vrai pour les vraies).
     Les modules simulés remplacent les vrais via une carte d'import (URL résolues). -->
<script>
  const q = new URLSearchParams(location.search);
  const modal = (titre, corps) => `
    function modal(titre, texte, boutons) { return new Promise(ok => {
      const d = document.createElement('div'); d.style.cssText = 'position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:#000b;font:16px Georgia,serif;color:#e6dfcc';
      d.innerHTML = '<div style="max-width:480px;background:#111;border:1px solid #c9a227;padding:16px 20px"><h3 style="margin:0 0 8px;color:#c9a227;font-family:Oswald,sans-serif">' + titre + '</h3><p>' + texte + '</p><div></div></div>';
      for (const [l, v] of boutons) { const b = document.createElement('button'); b.textContent = l; b.style.cssText = 'min-height:44px;margin:4px;padding:0 14px;background:#222;color:#e6dfcc;border:1px solid #c9a227;cursor:pointer'; b.onclick = () => { d.remove(); ok(v); }; d.querySelector('div > div').appendChild(b); }
      document.body.appendChild(d); }); }`;
  const dialogue = modal() + `
    export async function jouerScene(id) {
      const v = await modal('Scène simulée', 'Scène <b>' + id + '</b> (dialogue.js absent). Issue ?', [['Passer', 'fin'], ['Combat', 'combat'], ['Détour +200 m', 'detour'], ['Demi-tour', 'demi']]);
      if (v === 'combat') return { fin: '#combat', combat: { zombies: ['errant'] } };
      if (v === 'detour') return { fin: '#fin', detour: 200 };
      if (v === 'demi') return { fin: '#fin', demiTour: true };
      return { fin: '#fin' };
    }`;
  const explore = modal() + `
    export async function entrer({ lieuId }) {
      const flow = await import('` + location.origin + `/js/game/flow.js');
      await modal('Arrivée', 'Tu es arrivé(e) : <b>' + lieuId + '</b> (exploration simulée).', [['Rouvrir la carte', 1]]);
      flow.ouvrirCarte({ depuis: lieuId });
    }
    export function sortir() {} export function pause() {} export function reprise() {}
    export function actif() { return false; }
    export async function combatIci(spec) { return embuscade(spec); }
    export async function embuscade(spec) {
      const v = await modal('Embuscade simulée', 'Contre : ' + (spec.zombies || []).map(z => z.type || z).join(', ') + ' (' + (spec.surprise || 'normal') + ')', [['Victoire', 'victoire'], ['Fuite', 'fuite']]);
      return { issue: v, tues: [], fuis: [], xp: {} };
    }`;
  const effects = `export async function appliquerEffets(e) { console.log('[banc] effets', e); }`;
  const imports = { '/js/ui/dialogue.js': 'data:text/javascript,' + encodeURIComponent(dialogue) };
  if (q.get('explore') !== 'vrai') imports['/js/explore/vue.js'] = 'data:text/javascript,' + encodeURIComponent(explore);
  imports['/js/game/effects.js'] = 'data:text/javascript,' + encodeURIComponent(effects);
  const s = document.createElement('script'); s.type = 'importmap'; s.textContent = JSON.stringify({ imports });
  document.currentScript.after(s);
</script>
</head>
<body>
<div id="stage"></div>
<div id="toasts"></div>
<script type="module">
  // Paramètres : ?depuis=cimetiere · ?echelle=region · ?heure=22 · ?jour=3 · ?vers=tour_horloge (part tout de suite)
  //              ?allure=rapide · ?jumelles=1 · ?tout=1 (tous les lieux découverts) · ?prologue=1 · ?explore=vrai (embuscades jouables)
  import { nouvellePartie, G } from '../js/core/state.js';
  import * as clock from '../js/core/clock.js';
  import { on } from '../js/core/bus.js';
  import * as flow from '../js/game/flow.js';
  import { LIEUX } from '../js/game/donnees.js';
  const q = new URLSearchParams(location.search);
  nouvellePartie({ nom: 'Banc', seed: Number(q.get('seed') || 4242) });
  G.world.minutes = (Number(q.get('jour') || 1) - 1) * 1440 + Number(q.get('heure') || 8) * 60;
  if (!q.get('prologue')) G.world.flags.prologue_fini = true;
  if (q.get('jumelles')) G.player.inventaire.push({ id: 'jumelles', qty: 1 });
  if (q.get('tout')) for (const id in LIEUX) G.world.lieux[id] = { decouvert: true };
  if (q.get('plan')) G.world.flags.pro_plan_pris = true;          // le plan de Salon trouvé dans la loge
  if (q.get('routiere')) G.world.flags.carte_routiere_lue = true;  // la carte routière du pays salonais
  if (q.get('libre')) G.world.brouillard = false;                  // partie d'avant le brouillard
  G.world.lieux.hotel_poste = { decouvert: true, visite: true };
  G.world.quetes.q_protocole = { etape: 'emperi' };
  const depuis = q.get('depuis') || 'cimetiere';
  G.player.position = { mode: 'lieu', lieu: depuis };
  on('toast', ({ texte }) => { const d = document.createElement('div'); d.textContent = texte; document.getElementById('toasts').appendChild(d); setTimeout(() => d.remove(), 2500); });
  clock.demarrer();
  window.flow = flow; window.G = G;
  if (q.get('vers')) flow.voyager({ de: depuis, vers: q.get('vers'), allure: q.get('allure') || 'normale' });
  else flow.ouvrirCarte({ echelle: q.get('echelle') || undefined, depuis });
</script>
</body>
</html>
